<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildwood</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1d211b;
        color: #e8e6df;
        font: 14px system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 12px 0 0;
      }
      button {
        background: #2f362b;
        color: inherit;
        border: 1px solid #4a5444;
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.active {
        background: #4c8c3a;
        border-color: #4c8c3a;
      }
      #stats {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #map {
        display: block;
        width: 100%;
        max-width: 960px;
        image-rendering: pixelated;
        border-radius: 6px;
        cursor: crosshair;
      }
      p {
        color: #a3a89c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wildwood</h1>
      <button id="play">Pause</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="5">5x</button>
      <button data-speed="20">20x</button>
      <button id="reset">New world</button>
      <span id="stats"></span>
    </header>
    <canvas id="map"></canvas>
    <p>Click the map to drop a rabbit.</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
