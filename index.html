<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildwood</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1d211b;
        color: #e8e6df;
        font: 14px system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 12px 0 0;
      }
      button {
        background: #2f362b;
        color: inherit;
        border: 1px solid #4a5444;
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.active {
        background: #4c8c3a;
        border-color: #4c8c3a;
      }
      #stats {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 960px;
      }
      @media (min-width: 1280px) {
        main {
          grid-template-columns: minmax(0, 960px) 320px;
          max-width: none;
          align-items: start;
        }
      }
      #map {
        display: block;
        width: 100%;
        image-rendering: pixelated;
        border-radius: 6px;
        cursor: crosshair;
      }
      .chart-wrap {
        position: relative;
      }
      #chart {
        display: block;
        width: 100%;
        border-radius: 6px;
        cursor: crosshair;
      }
      #chart-tooltip {
        position: absolute;
        top: 4px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #e8e6df;
        color: #1d211b;
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
      }
      .controls {
        display: grid;
        gap: 14px;
        margin-top: 16px;
        padding: 12px;
        background: #262b23;
        border-radius: 6px;
      }
      .controls h2 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #a3a89c;
      }
      .controls label {
        display: grid;
        grid-template-columns: 84px 1fr 40px;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      .controls label span:last-child {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #a3a89c;
      }
      .controls input[type='range'] {
        width: 100%;
        accent-color: #4c8c3a;
      }
      select {
        width: 100%;
        background: #2f362b;
        color: inherit;
        border: 1px solid #4a5444;
        border-radius: 6px;
        padding: 4px 6px;
        font: inherit;
      }
      .note {
        margin: 6px 0 0;
        color: #a3a89c;
        font-size: 13px;
        line-height: 1.4;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 6px;
      }
      .spacer {
        flex: 1;
      }
      .place {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: #a3a89c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wildwood</h1>
      <button id="play">Pause</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="5">5x</button>
      <button data-speed="20">20x</button>
      <span id="stats"></span>
    </header>
    <main>
      <div>
        <canvas id="map"></canvas>
        <div class="place">
          Click the map to drop a
          <button data-place="rabbit" class="active">Rabbit</button>
          <button data-place="fox">Fox</button>
          <span class="spacer"></span>
          Scent
          <button data-scent="" class="active">Off</button>
          <button data-scent="rabbit">Rabbits</button>
          <button data-scent="fox">Foxes</button>
        </div>
      </div>
      <aside>
        <div class="chart-wrap">
          <canvas id="chart" aria-label="Population over time"></canvas>
          <div id="chart-tooltip" hidden></div>
        </div>
        <div class="controls">
          <section>
            <h2>Preset</h2>
            <select id="preset"></select>
            <p class="note" id="preset-watch"></p>
          </section>
          <section>
            <h2>World</h2>
            <label><span>Water</span><input id="water" type="range" /><span id="water-value"></span></label>
            <label><span>Forest</span><input id="forest" type="range" /><span id="forest-value"></span></label>
            <label><span>Patchiness</span><input id="patchiness" type="range" /><span id="patchiness-value"></span></label>
            <div class="row">
              <button id="new-world">New world</button>
              <button id="randomize">Randomize</button>
              <span class="note" id="world-hint" hidden>Applies on New world</span>
            </div>
          </section>
          <section>
            <h2>Climate <span style="text-transform: none; letter-spacing: 0; font-weight: 400">(live)</span></h2>
            <label><span>Rainfall</span><input id="rainfall" type="range" /><span id="rainfall-value"></span></label>
            <label><span>Seasons</span><input id="seasons" type="range" /><span id="seasons-value"></span></label>
          </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
