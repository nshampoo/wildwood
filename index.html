<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildwood</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #1d211b;
        color: #e8e6df;
        font: 14px system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 12px 0 0;
      }
      button {
        background: #2f362b;
        color: inherit;
        border: 1px solid #4a5444;
        border-radius: 6px;
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.active {
        background: #4c8c3a;
        border-color: #4c8c3a;
      }
      #stats {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 960px;
      }
      @media (min-width: 1280px) {
        main {
          grid-template-columns: minmax(0, 960px) 320px;
          max-width: none;
          align-items: start;
        }
      }
      #map {
        display: block;
        width: 100%;
        image-rendering: pixelated;
        border-radius: 6px;
        cursor: crosshair;
      }
      .chart-wrap {
        position: relative;
      }
      #chart {
        display: block;
        width: 100%;
        border-radius: 6px;
        cursor: crosshair;
      }
      #chart-tooltip {
        position: absolute;
        top: 4px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #e8e6df;
        color: #1d211b;
        font-size: 12px;
        pointer-events: none;
        white-space: nowrap;
      }
      .place {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        color: #a3a89c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wildwood</h1>
      <button id="play">Pause</button>
      <button data-speed="1" class="active">1x</button>
      <button data-speed="5">5x</button>
      <button data-speed="20">20x</button>
      <button id="reset">New world</button>
      <span id="stats"></span>
    </header>
    <main>
      <div>
        <canvas id="map"></canvas>
        <div class="place">
          Click the map to drop a
          <button data-place="rabbit" class="active">Rabbit</button>
          <button data-place="fox">Fox</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" aria-label="Population over time"></canvas>
        <div id="chart-tooltip" hidden></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
